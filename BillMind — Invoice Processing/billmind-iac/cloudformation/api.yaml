AWSTemplateFormatVersion: '2010-09-09'
Description: BillMind Lambda functions, API Gateway routes, and Cognito JWT authorizer.

Parameters:
  Environment:
    Type: String
  ArtifactBucket:
    Type: String
  BillsLambdaKey:
    Type: String
  InvoiceLambdaKey:
    Type: String
  BillsTableName:
    Type: String
  InvoicesTableName:
    Type: String
  InvoiceBucketName:
    Type: String
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  FrontendOrigin:
    Type: String

Resources:
  BillsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BillMindBillsRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillsTableName}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillsTableName}/index/*
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  InvoiceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BillMindInvoiceRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InvoicesTableName}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InvoicesTableName}/index/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${InvoiceBucketName}/*
              - Effect: Allow
                Action: [textract:AnalyzeDocument]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  BillsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: billmind-bills-api
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt BillsLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BillsLambdaKey
      Environment:
        Variables:
          BILLS_TABLE: !Ref BillsTableName
          INVOICES_TABLE: !Ref InvoicesTableName
          INVOICE_BUCKET: !Ref InvoiceBucketName
          ENVIRONMENT: !Ref Environment

  InvoiceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: billmind-invoice-processor
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt InvoiceLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref InvoiceLambdaKey
      Environment:
        Variables:
          BILLS_TABLE: !Ref BillsTableName
          INVOICES_TABLE: !Ref InvoicesTableName
          INVOICE_BUCKET: !Ref InvoiceBucketName
          ENVIRONMENT: !Ref Environment

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: billmind-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 3600

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: BillMindCognitoJwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClientId]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}

  BillsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BillsLambda.Arn
      PayloadFormatVersion: '2.0'

  InvoiceIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt InvoiceLambda.Arn
      PayloadFormatVersion: '2.0'

  BillsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /bills'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${BillsIntegration}

  BillsItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /bills/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${BillsIntegration}

  ImportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /bills/import'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${BillsIntegration}

  InvoiceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /invoices'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${InvoiceIntegration}

  InvoiceItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /invoices/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${InvoiceIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  BillsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BillsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  InvoiceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref InvoiceLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
