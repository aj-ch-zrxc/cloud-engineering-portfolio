AWSTemplateFormatVersion: '2010-09-09'
Description: CloudScope RCM HTTP API and Lambda integrations.

Parameters:
  Environment:
    Type: String
  ResourcesFunctionArn:
    Type: String
  ScanResultsFunctionArn:
    Type: String
  ArtifactPrefix:
    Type: String

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub aws-rcm-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['https://REPLACE_WITH_FRONTEND_ORIGIN']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 3600

  ResourcesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref ResourcesFunctionArn
      PayloadFormatVersion: '2.0'

  ScanResultsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref ScanResultsFunctionArn
      PayloadFormatVersion: '2.0'

  ResourcesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /resources'
      Target: !Sub integrations/${ResourcesIntegration}

  ScanResultsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /scan-results'
      Target: !Sub integrations/${ScanResultsIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
